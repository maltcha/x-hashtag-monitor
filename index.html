<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff5f7">
<title>X Hashtag Monitor</title>

<style>
:root{
  --pink:#e76d91;
  --dark:#b9476d;
  --soft:#fff1f5;
  --bg:#fff9fa;
  --text:#49343d;
  --muted:#927e86;
  --border:#f4dce4;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  background:var(--white);
  border-bottom:1px solid var(--border);
  padding:20px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:800;
  color:var(--dark);
}

.logo span{
  color:var(--pink);
}

.status{
  font-size:12px;
  background:#eaf8ed;
  color:#438b56;
  padding:8px 12px;
  border-radius:20px;
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.welcome{
  background:linear-gradient(135deg,#ffe5ec,#fff4f6);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  margin-bottom:22px;
}

.welcome h1{
  margin:0 0 10px;
  font-size:27px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat,.card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
}

.stat small{
  color:var(--muted);
}

.stat strong{
